<svg viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg" width="440" height="160">
  <!-- Background -->
  <rect width="220" height="80" fill="#0A0F1E"/>

  <!-- Dog tag cord -->
  <line x1="24" y1="4" x2="24" y2="14" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chain loop -->
  <circle cx="24" cy="18" r="3" stroke="#D97706" stroke-width="1.5"/>

  <!-- Dog tag body -->
  <rect x="8" y="20" width="32" height="52" rx="7" stroke="#D97706" stroke-width="1.5"/>

  <!-- Engraved line above text -->
  <line x1="14" y1="38" x2="34" y2="38" stroke="#D97706" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- TBD text -->
  <text x="24" y="51" text-anchor="middle" fill="#D97706" font-size="13" font-family="Impact, sans-serif" letter-spacing="2">TBD</text>

  <!-- Engraved line below text -->
  <line x1="14" y1="56" x2="34" y2="56" stroke="#D97706" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- TOMMYBOY text -->
  <text x="52" y="38" fill="#FFFFFF" font-size="22" font-family="Impact, sans-serif" letter-spacing="3">TOMMYBOY</text>

  <!-- DESIGNS text -->
  <text x="54" y="52" fill="#D97706" font-size="11" font-family="Impact, sans-serif" letter-spacing="6">DESIGNS</text>
</svg>
